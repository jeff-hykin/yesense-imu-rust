[package]
name = "yesense-imu"
version = "0.1.0"
edition = "2021"
description = "Driver for Yesense IMUs (YIS series) over a serial port: the standard binary output protocol decoded into accel, gyro, orientation, temperature and timestamps"
license = "Apache-2.0"
repository = "https://github.com/jeff-hykin/yesense-imu-rust"
readme = "README.md"
keywords = ["imu", "yesense", "serial", "ahrs", "robotics"]
categories = ["hardware-support", "embedded", "science::robotics"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
libc = "0.2"

[[bin]]
name = "yesense-dump"
path = "src/bin/yesense_dump.rs"
